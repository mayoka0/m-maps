          // Only clear dest if no active find preview.
          if (!foundPlace) clearDestMarker();
          activeMoveSpeed = null;
        }
        // Always re-render trip button enabled state (not only on wasMoving).
        renderTripList();
      }
      wasMoving = moving;
      updateHint();
    }

    async function poll() {
      try { renderStatus(await (await fetch('/status')).json()); }
      catch (err) { $('deviceName').textContent = 'backend unreachable'; $('deviceDot').className = 'dot err'; }
    }
    poll();
    setInterval(poll, 1000);
    updateHint();

    // ---- Optional update check (notify only; never blocks the app) -------
    // Public GitHub Releases API — no token. Fail silently offline.
    const UPDATE_LS_KEY = 'mmaps-update-check-at';
    const UPDATE_DISMISS_KEY = 'mmaps-update-dismissed-tag';
    // During active development, check at most once per hour (not once/day).
    const UPDATE_INTERVAL_MS = 60 * 60 * 1000;
    let appVersion = null;
    let githubRepo = 'mayoka0/m-maps';
    let updateCheckStarted = false;

    function parseVersionParts(tag) {
      const s = String(tag || '').trim().replace(/^v/i, '');
      return s.split(/[.+-]/).map((p) => {
        const n = parseInt(p, 10);
        return Number.isFinite(n) ? n : 0;
      });
    }
    function isNewerRelease(latestTag, currentVersion) {
      if (!latestTag || !currentVersion) return false;
      const a = parseVersionParts(latestTag);
      const b = parseVersionParts(currentVersion);
      const n = Math.max(a.length, b.length);
      for (let i = 0; i < n; i++) {
        const x = a[i] || 0, y = b[i] || 0;
        if (x > y) return true;
        if (x < y) return false;
      }
      return false;
    }
    function showUpdateBanner(tag, url) {
      const bar = $('updateBanner');
      if (!bar) return;
      $('updateBannerText').innerHTML =
        '<b>A new version of M Maps is available</b> · ' + escapeHtml(tag) +
        ' (you have ' + escapeHtml(appVersion || '?') + ')';
      const link = $('updateBannerLink');
      link.href = url || ('https://github.com/' + githubRepo + '/releases');
      bar.style.display = 'flex';
    }
    function hideUpdateBanner() {
      const bar = $('updateBanner');
      if (bar) bar.style.display = 'none';
    }
    $('updateDismissBtn').addEventListener('click', () => {
      try {
        const tag = $('updateBannerLink').dataset.tag || '';
        if (tag) localStorage.setItem(UPDATE_DISMISS_KEY, tag);
      } catch (e) {}
      hideUpdateBanner();
    });

    async function checkForUpdates(version, repo, { force = false } = {}) {
      if (!version) return;
      appVersion = version;
      if ($('appVersion')) $('appVersion').textContent = version;
      if (repo) githubRepo = repo;
      try {
        const now = Date.now();
        const last = parseInt(localStorage.getItem(UPDATE_LS_KEY) || '0', 10) || 0;
        if (!force && last && (now - last) < UPDATE_INTERVAL_MS) return;
        localStorage.setItem(UPDATE_LS_KEY, String(now));
      } catch (e) {
        // localStorage unavailable — still try once this session.
      }
      try {
        // githubRepo is "owner/name" from /status (no user input).
        const res = await fetch(
          'https://api.github.com/repos/' + githubRepo + '/releases/latest',
          { headers: { Accept: 'application/vnd.github+json' } }
        );
        if (!res.ok) return;
        const data = await res.json();
        const tag = data.tag_name || '';
        const url = data.html_url || ('https://github.com/' + githubRepo + '/releases');
        if (!isNewerRelease(tag, version)) {
          // Already latest — no banner (correct). Version chip still shows current.
          return;
        }
        try {
          if (localStorage.getItem(UPDATE_DISMISS_KEY) === tag) return;
        } catch (e) {}
        $('updateBannerLink').dataset.tag = tag;
        showUpdateBanner(tag, url);
      } catch (e) {
        // Offline / GitHub unreachable — silent.
      }
    }

    // Kick off once we know the running server's version from /status.
    (async function initUpdateCheck() {
      if (updateCheckStarted) return;
      updateCheckStarted = true;
      try {
        const s = await (await fetch('/status')).json();
        if (s.version && $('appVersion')) $('appVersion').textContent = s.version;
        await checkForUpdates(s.version, s.github_repo);
      } catch (e) { /* silent */ }
    })();

    // Manual re-check: click the version chip in the header.
    if ($('versionChip')) {
      $('versionChip').style.cursor = 'pointer';
      $('versionChip').title = 'Running version — click to check for updates';
      $('versionChip').addEventListener('click', async () => {
        try {
          localStorage.removeItem(UPDATE_LS_KEY);
        } catch (e) {}
        try {
          const s = await (await fetch('/status')).json();
          await checkForUpdates(s.version, s.github_repo, { force: true });
          // Soft feedback when already up to date (banner stays hidden).
          if ($('updateBanner').style.display !== 'flex') {
            showBanner('You’re on the latest release (v' + (s.version || '?') + ').', 'warn');
            setTimeout(() => { if (bannerKind === 'warn') hideBanner(); }, 3500);
          }
        } catch (e) { /* silent */ }
      });
    }
  </script>
</body>
</html>
